<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181d">
<meta name="description" content="Precious AI — your personal AI agent that only says what it knows, with real citations, memory you approve, and full owner controls.">
<title>Precious AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2318181b'/%3E%3Cpath d='M12 3c.46 5.05 4.45 9.04 9.5 9.5-5.05.46-9.04 4.45-9.5 9.5-.46-5.05-4.45-9.04-9.5-9.5 5.05-.46 9.04-4.45 9.5-9.5z' fill='white'/%3E%3C/svg%3E">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/app.css">
<!-- Vercel Speed Insights (only active when hosted on Vercel) -->
<script src="/_speedinsights.js" defer></script>
<!-- Deployment config (API base URL for split hosting). Loads first. -->
<script src="/config.js"></script>
</head>
<body>

<!-- ======= AUTH ======= -->
<div id="auth-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.6 6.4 5.6 11.4 12 12-6.4.6-11.4 5.6-12 12-.6-6.4-5.6-11.4-12-12C6.4 11.4 11.4 6.4 12 0z"/></svg>
    </div>
    <h1>Precious AI</h1>
    <p class="auth-sub" id="auth-sub">Your personal AI agent — set up your owner account</p>
    <form id="auth-form" autocomplete="off">
      <label class="field">
        <span>Username</span>
        <input id="auth-username" type="text" autocomplete="username" placeholder="owner" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="auth-password" type="password" autocomplete="current-password"
               placeholder="At least 8 characters" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Create owner account</button>
      <div id="auth-error" class="form-error" role="alert" aria-live="polite"></div>
    </form>
    <p class="auth-note">Owner access controls the entire agent. Your data stays on your server —
      nothing is stored elsewhere.</p>
  </div>
</div>

<!-- ======= APP ======= -->
<div id="app" class="hidden">
  <aside id="sidebar" aria-label="Main menu"></aside>
  <div id="drawer" role="dialog" aria-modal="true" aria-label="Menu"></div>
  <div id="drawer-backdrop"></div>

  <div id="main">
    <header id="topbar">
      <button id="burger" class="icon-btn" aria-label="Open menu" aria-haspopup="dialog">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="view-title">Chat</div>
      <div id="topbar-actions">
        <button id="theme-btn" class="icon-btn" aria-label="Toggle light or dark theme"></button>
      </div>
    </header>
    <div id="view-root"></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="/js/common.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/knowledge.js"></script>
<script src="/js/memory.js"></script>
<script src="/js/training.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
